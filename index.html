<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f4f7fb;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }

        .card {
            width: min(90%, 650px);
            background: #fff;
            padding: 45px 35px;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            margin: 0 0 18px;
            font-size: 2rem;
            color: #222;
        }

        p {
            margin: 10px 0;
            line-height: 1.7;
            color: #666;
        }

        .line {
            width: 70px;
            height: 4px;
            margin: 20px auto;
            border-radius: 10px;
            background: #4a90e2;
        }

        small {
            display: block;
            margin-top: 30px;
            color: #999;
        }
    </style>
</head>
<body>

    <main class="card">
        <h1>Welcome</h1>

        <div class="line"></div>

        <p>
            This website serves as an official online presence for our applications and related services.
        </p>

        <p>
            Thank you for visiting.
        </p>

        <small>&copy; 2026</small>
    </main>

</body>
</html>
